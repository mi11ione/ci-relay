name: ci
# Runs the private project's CI on GitHub-hosted runners. Logs print only pass/fail; no source or results are echoed.
on:
  workflow_dispatch:
    inputs:
      ref: {description: "commit or branch", default: "main"}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {repository: mi11ione/beim-wort, ref: "${{ inputs.ref }}", ssh-key: "${{ secrets.SRC_DEPLOY_KEY }}", persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: tests, selfcheck, claims
        working-directory: track_1a
        run: |
          pip install -q -e ".[dev]" > /tmp/l 2>&1 || { echo "install failed"; exit 1; }
          python -m pytest -q > /tmp/l 2>&1 && echo "pytest: $(tail -1 /tmp/l | grep -o '[0-9]* passed')" || { echo "pytest: FAIL"; exit 1; }
          apertus-rt selfcheck > /tmp/l 2>&1; r=$?; echo "selfcheck: $(tail -1 /tmp/l | cut -c1-20), FAIL lines: $(grep -c '\[FAIL\]' /tmp/l)"; [ $r = 0 ] || exit 1
          apertus-rt claims --text > /tmp/l 2>&1; r=$?; echo "claims: $(tail -1 /tmp/l | grep -o '[0-9]*/[0-9]* claims hold')"; [ $r = 0 ] || exit 1
  make-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {repository: mi11ione/beim-wort, ref: "${{ inputs.ref }}", ssh-key: "${{ secrets.SRC_DEPLOY_KEY }}", persist-credentials: false}
      - name: make run and make test (Docker, CPU, no keys)
        working-directory: track_1a
        run: |
          s=$(date +%s); make run > /tmp/l 2>&1; echo "make run: $(tail -1 /tmp/l | cut -c1-20) in $(( $(date +%s) - s )) s"; grep -qx OK /tmp/l || exit 1
          make test > /tmp/l 2>&1 && echo "make test: $(tail -1 /tmp/l | grep -o '[0-9]* passed')" || { echo "make test: FAIL"; exit 1; }
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {repository: mi11ione/beim-wort, ref: "${{ inputs.ref }}", ssh-key: "${{ secrets.SRC_DEPLOY_KEY }}", persist-credentials: false, fetch-depth: 0}
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 > /tmp/l 2>&1 && echo "gitleaks: no leaks" || { echo "gitleaks: findings (not shown)"; exit 1; }
